<!doctype html><meta charset="utf-8"><title>읽기 점검</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<body style="font-family:sans-serif;padding:20px">
<h3>읽기 점검 (쓰기 없음)</h3>
<p>이메일 <input id="em" value="dossier@don.local"> 비밀번호 <input id="pw" type="password">
<button id="go">로그인 후 읽기</button></p>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
const log = s => { document.getElementById('log').textContent += s + "\n"; };
document.getElementById('go').onclick = async () => {
  try {
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    log('LOGIN OK');
    const snap = await firebase.database().ref('wiki').get();
    const v = snap.val() || {}; const store = v.store || {};
    for (const wk of Object.keys(store)) {
      const w = store[wk];
      log('WORLD ' + wk + ' ' + (w.name||'') + ' chars=' + (w.chars?w.chars.length:0) + ' groups=' + JSON.stringify(w.groups||[]));
      (w.chars||[]).forEach(c => log('  ' + c.profile.name + ' groups=' + JSON.stringify(c.groupIds||[]) + ' pos=' + (c.position||'')));
    }
    log('READ DONE no write');
  } catch(e) { log('ERROR ' + (e && e.message)); }
};
</script></body>
