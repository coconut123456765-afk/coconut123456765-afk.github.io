<!DOCTYPE html><html><head><meta charset="utf-8"><title>ahn-subtitles</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body>
<input id="em" placeholder="email"><input id="pw" type="password" placeholder="password">
<button id="go">안씨네 호칭 실행</button><pre id="log"></pre><script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const logEl=document.getElementById('log');
function log(s){ logEl.textContent += "\n" + s; }
document.getElementById('go').onclick = async ()=>{
  try{
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    const ref = firebase.database().ref("wiki");
    const snap = await ref.once("value");
    const v = snap.val()||{};
    const store = v.store||{};
    const sib = store["siblings"];
    const map = {"c1792343036533":"안씨네 첫째","c1792394387441":"안씨네 둘째","c1792313574027":"안씨네 넷째","c1792350034365":"안씨네 다섯째","c1792660050682":"안씨네 엄마","c1792660051543":"안씨네 아빠"};
    Object.entries(map).forEach(([id, sub])=>{
      const c = (sib.chars||[]).find(x=>x.id===id);
      if (c){ c.subtitle = sub; log((c.profile&&c.profile.name)+" -> "+sub); } else log("NOT FOUND "+id);
    });
    v.store = store; v.storeUpdatedAt = Date.now();
    await ref.set(v);
    log("DONE siblings chars="+(sib.chars||[]).length);
  }catch(e){ log("ERR "+e.message); }
};
</script></body></html>
