<!DOCTYPE html><html><head><meta charset="utf-8"><title>diag mybaby</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body><pre id="log">loading...</pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const FIELDS = ["nickname","ename","formerName","otherNames","oldNick","age","birthday","height","blood","starsign","weight","three","bra","hand","gender","color","position","affil","birthplace","hobby","specialty","likes","dislikes","quote","overview","appearance","promptChar","promptOutfit","bodyImg","defaultDesc"];
(async ()=>{
  const log = document.getElementById('log');
  try{
    const snap = await db.ref('wiki').get();
    const data = snap.val() || {};
    const store = data.store || {};
    let out = [];
    for (const wkey of Object.keys(store)){
      const w = store[wkey] || {};
      const chars = w.chars || [];
      out.push("WORLD " + wkey + " (" + (w.name||"") + ") chars=" + chars.length);
      chars.forEach(c => {
        const p = c.profile || {};
        const name = p.name || c.id;
        const empty = FIELDS.filter(f => {
          const v = (f in c) ? c[f] : p[f];
          return v === undefined || v === null || (typeof v === "string" && v.trim() === "");
        });
        const filled = FIELDS.filter(f => !empty.includes(f));
        out.push("  CHAR " + c.id + " | " + name + " | illust=" + ((c.illust||"").split("\n").filter(s=>s.trim()).length) + " pairs=" + ((c.wardrobeImgs||[]).length) + " weapon=" + ((c.weaponImgs||[]).length) + " customRows=" + ((c.customRows||[]).length));
        out.push("    FILLED: " + filled.join(","));
        out.push("    EMPTY: " + empty.join(","));
      });
    }
    out.push("DONE worlds=" + Object.keys(store).length);
    log.textContent = out.join("\n");
  }catch(e){ log.textContent = "ERROR " + e.message; }
})();
</script></body></html>
