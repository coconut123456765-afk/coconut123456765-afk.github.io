<!DOCTYPE html><html><head><meta charset="utf-8"><title>diag imgs</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body><pre id="log"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const log = m => { document.getElementById('log').textContent += m + "\n"; };
db.ref('wiki').get().then(snap => {
  const data = snap.val() || {};
  const store = data.store || {};
  for (const [wk, w] of Object.entries(store)){
    if (!w || !Array.isArray(w.chars)) continue;
    for (const c of w.chars){
      const wi = Array.isArray(c.wardrobeImgs) ? c.wardrobeImgs : [];
      const wp = Array.isArray(c.weaponImgs) ? c.weaponImgs : [];
      const wiEmpty = wi.filter(x => !x || !x.img).length;
      const wpEmpty = wp.filter(x => !x || !x.img).length;
      log("CHAR " + wk + " | " + (c.profile && c.profile.name ? c.profile.name : "(이름없음)") + " | wardrobePairs=" + wi.length + " (noImg=" + wiEmpty + ") | weaponPairs=" + wp.length + " (noImg=" + wpEmpty + ") | bodyImg=" + (c.bodyImg ? "Y" : "N") + " | thumb=" + (c.thumb ? "Y" : "N"));
    }
  }
  log("DONE");
}).catch(e => log("ERROR " + e.message));
</script></body></html>
