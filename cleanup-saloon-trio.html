<!doctype html><meta charset="utf-8"><title>살룬 정리 + 삼총사 빼기</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<body style="font-family:sans-serif;padding:20px">
<p>이메일 <input id="em" value="dossier@don.local"> 비밀번호 <input id="pw" type="password">
<button id="go">로그인 후 실행</button></p>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
const log = s => { document.getElementById('log').textContent += s + "\n"; };
document.getElementById('go').onclick = async () => {
  try {
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    const ref = firebase.database().ref('wiki');
    const v = (await ref.get()).val() || {}; const store = v.store || {};
    // 살룬: 꼬인 그룹 전부 삭제, 살룬 조직만 남기고 5명 전원 소속
    const h = store['hotel'];
    log('HOTEL BEFORE groups=' + JSON.stringify((h.groups||[]).map(g=>g.id+':'+g.name)));
    h.groups = [{id:'g-saloon', name:'살룬 라군', parentId:null, kind:'org', logo:'', topCount:4}];
    (h.chars||[]).forEach(c=>{ c.groupIds=['g-saloon']; log('  '+c.profile.name+' -> [g-saloon]'); });
    // 청량고: 삼총사 삭제, 도이·안젤리나는 모니카반으로
    const s = store['siblings'];
    log('SIB BEFORE groups=' + JSON.stringify((s.groups||[]).map(g=>g.id+':'+g.name)));
    s.groups = (s.groups||[]).filter(g=>g.id!=='g-trio');
    (s.chars||[]).forEach(c=>{
      if (!Array.isArray(c.groupIds)) c.groupIds=[];
      if (c.groupIds.includes('g-trio')) { c.groupIds = c.groupIds.filter(id=>id!=='g-trio'); if (!c.groupIds.includes('g-monica')) c.groupIds.push('g-monica'); }
      log('  '+c.profile.name+' groups='+JSON.stringify(c.groupIds));
    });
    v.storeUpdatedAt = Date.now();
    await ref.set(v);
    log('DONE hotel groups=' + JSON.stringify(h.groups) + ' sib groups=' + JSON.stringify(s.groups.map(g=>g.id+':'+g.name)));
  } catch(e) { log('ERROR ' + (e && e.message)); }
};
</script></body>
