<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppet:Don</title>
<style>
body{font-family:system-ui, sans-serif; margin:0; background:#faf8f5; color:#222;}
header{padding:20px 16px 12px; border-bottom:1px solid #ddd; background:#fff;}
.brand{font-size:28px; font-weight:800;} .brand span{color:#7b5aa6;}
.sub{color:#666; font-size:13px; margin-top:4px;}
.tabs{display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap; background:#fff; border-bottom:1px solid #ddd;}
.tab{padding:8px 14px; border:1px solid #ccc; border-radius:20px; background:#fff; cursor:pointer;}
.tab.active{background:#222; color:#fff; border-color:#222;}
.search{padding:12px 16px;} .search input{width:100%; max-width:420px; padding:10px 12px; border:1px solid #ccc; border-radius:8px; font-size:15px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; padding:16px;}
.card{border:1px solid #ddd; border-radius:12px; background:#fff; overflow:hidden; cursor:pointer;}
.ph{aspect-ratio:2/3; background:#e9e6e1; display:flex; align-items:center; justify-content:center; color:#888; font-size:13px; text-align:center; padding:8px;}
.meta{padding:10px 12px;} .meta b{display:block;} .meta span{color:#666; font-size:12px;}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:20px;}
.modal.open{display:flex;} .modal-box{background:#fff; border-radius:12px; max-width:420px; width:100%; padding:16px;}
.modal-box .ph{aspect-ratio:2/3;}
.note{padding:0 16px 20px; color:#666; font-size:13px;}
</style>
</head>
<body>
<header>
<div class="brand">Puppet<span>:</span>Don</div>
<div class="sub">POSE REFERENCE · DON ONLY · 프로토타입 — 포즈 depth 갤러리 구조를 모티브로 함</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="search"><input id="q" placeholder="포즈 검색 (프로토타입: 이름으로만 검색)"></div>
<div class="grid" id="grid"></div>
<div class="note">프로토타입 안내: 구조만 만든 버전입니다. 이미지와 실제 포즈 데이터는 아직 들어 있지 않습니다. 프롬이 있는 포즈는 트렁크, 프롬이 없는 보기용 포즈는 이 사이트에 넣는 구분으로 갑니다.</div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
<div class="modal-box">
<div class="ph" id="modalPh">포즈 참고 이미지 자리</div>
<div class="meta"><b id="modalName"></b><span id="modalCat"></span></div>
<button onclick="closeModal()">닫기</button>
</div>
</div>
<script>
const cats=[
 {id:'full-sexy', label:'전신 1인 · 섹시', count:399, poses:80},
 {id:'full-std', label:'전신 1인 · 표준', count:365, poses:73},
 {id:'upper', label:'상반신 1인', count:400, poses:80},
 {id:'couple', label:'2인 커플', count:275, poses:55},
];
let cur='full-sexy';
const tabsEl=document.getElementById('tabs');
cats.forEach(c=>{
 const b=document.createElement('button');
 b.className='tab'+(c.id===cur?' active':'');
 b.textContent=c.label+' '+c.count+'장 · '+c.poses+'포즈';
 b.onclick=()=>{cur=c.id; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render();};
 tabsEl.appendChild(b);
});
function render(){
 const grid=document.getElementById('grid');
 const q=(document.getElementById('q').value||'').trim();
 const cat=cats.find(c=>c.id===cur);
 grid.innerHTML='';
 for(let i=1;i<=12;i++){
   const name=cat.label+' 예시 '+String(i).padStart(3,'0');
   if(q && !name.includes(q)) continue;
   const d=document.createElement('div'); d.className='card';
   d.innerHTML='<div class="ph">포즈 참고<br>이미지 자리</div><div class="meta"><b>'+name+'</b><span>'+cat.label+'</span></div>';
   d.onclick=()=>{document.getElementById('modalName').textContent=name; document.getElementById('modalCat').textContent=cat.label; document.getElementById('modal').classList.add('open');};
   grid.appendChild(d);
 }
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
</html>
