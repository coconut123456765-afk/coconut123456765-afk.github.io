<!DOCTYPE html><html><head><meta charset="utf-8"><title>diag illust2</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body><pre id="log"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const log = m => { document.getElementById('log').textContent += m + "\n"; };
function check(url){
  return new Promise(res => {
    const im = new Image();
    const t = setTimeout(() => res("TIMEOUT"), 15000);
    im.onload = () => { clearTimeout(t); res("OK"); };
    im.onerror = () => { clearTimeout(t); res("FAIL"); };
    im.src = url;
  });
}
db.ref('wiki').get().then(async snap => {
  const data = snap.val() || {};
  const store = data.store || {};
  for (const [wk, w] of Object.entries(store)){
    if (!w || !Array.isArray(w.chars)) continue;
    for (const c of w.chars){
      const lines = String(c.illust || "").split("\n").map(s => s.trim()).filter(Boolean);
      log("CHAR " + wk + " | " + (c.profile && c.profile.name ? c.profile.name : "(이름없음)") + " | lines=" + lines.length);
      for (let i = 0; i < lines.length; i++){
        const st = /^https?:\/\//.test(lines[i]) ? await check(lines[i]) : "NOTURL";
        log("  [" + i + "] " + st + " " + lines[i]);
      }
    }
  }
  log("DONE");
}).catch(e => log("ERROR " + e.message));
</script></body></html>
