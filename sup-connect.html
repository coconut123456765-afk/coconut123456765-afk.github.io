<!doctype html><meta charset="utf-8"><title>상급자 연결</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<body style="font-family:sans-serif;padding:20px">
<p>이메일 <input id="em" value="dossier@don.local"> 비밀번호 <input id="pw" type="password">
<button id="go">로그인 후 실행</button></p>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
const log = s => { document.getElementById('log').textContent += s + "\n"; };
document.getElementById('go').onclick = async () => {
  try {
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    const ref = firebase.database().ref('wiki');
    const v = (await ref.get()).val() || {}; const store = v.store || {}; const w = store['siblings'];
    const byId = {}; (w.chars||[]).forEach(c=>byId[c.id]=c);
    const setSup = (cid, gid, sup) => { const c = byId[cid]; if (!c) return; if (!c.groupSuperior) c.groupSuperior = {}; c.groupSuperior[gid] = sup; log(c.profile.name + ' sup['+gid+'] -> ' + (byId[sup]?byId[sup].profile.name:sup)); };
    // 모니카반: 모니카가 상급자
    setSup('c1792313574027','g-monica','c1792782821758');
    setSup('c1792394391937','g-monica','c1792782821758');
    // 안씨네: 안오룡이 상급자
    ['c1792343036533','c1792394387441','c1792313574027','c1792350034365'].forEach(id=>setSup(id,'g-ahn','c1792660051543'));
    // 도씨네: 도말숙이 상급자
    setSup('c1792660214065','g-do','c1792660050682');
    v.storeUpdatedAt = Date.now();
    await ref.set(v);
    log('DONE');
  } catch(e) { log('ERROR ' + (e && e.message)); }
};
</script></body>
