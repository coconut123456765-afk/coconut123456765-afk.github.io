document.getElementById('runBtn').onclick = async () => {
  const snap = await db.ref('wiki').get();
  const data = snap.val() || {};
  const store = data.store || {};
  let wkey = "w1792508654855";
  let w = store[wkey];
  if (!w || !Array.isArray(w.chars)) {
    for (const k of Object.keys(store)) {

  const chars = w.chars;
  log("SCANNED mybaby chars=" + chars.length);
  let added = 0, skipped = 0;
  for (const nc of NEWCHARS) {
    const dup = chars.find(c => c.profile && (c.profile.name === nc.profile.name || c.profile.name === nc.altName));

    log("ADDED " + nc.profile.name + " id " + nc.id);
