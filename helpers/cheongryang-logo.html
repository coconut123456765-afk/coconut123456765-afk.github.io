<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청량고등학교 로고 설정 도우미</title>
<style>
  body{font-family:'Noto Sans KR',sans-serif;max-width:560px;margin:0 auto;padding:24px 16px;background:#f6f3fa;color:#2a1f1f}
  h1{font-size:20px} .card{background:#fff;border:1px solid #ddd6e8;border-radius:12px;padding:16px;margin:12px 0}
  button{background:#7b5aa6;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
  button:disabled{background:#bbb} input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd6e8;border-radius:8px;font-size:15px;margin:6px 0}
  .org{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #eee}
  .org img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid #eee}
  .org .nm{flex:1} .ok{color:#2e7d32;font-weight:700} .err{color:#c0392b;font-weight:700}
  .hint{font-size:13px;color:#9c8a84}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
<h1>청량고등학교 로고 설정 도우미</h1>
<p class="hint">청량고등학교 로고(Cloudinary 업로드 완료)를 도시 위키의 조직 로고로 넣어줘요. 로고 사진 외에는 아무것도 바꾸지 않아요. 비밀번호는 이 브라우저에서만 쓰고, 아냐한테는 안 보내요.</p>
<div id="status" class="card">불러오는 중…</div>

<div id="loginCard" class="card" style="display:none">
  <h3>마스터 로그인</h3>
  <input id="loginEmail" type="email" value="coconut123456765@gmail.com">
  <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="loginBtn">로그인</button>
  <p id="loginErr" class="err" style="display:none"></p>
</div>

<div id="orgCard" class="card" style="display:none">
  <h3>조직 고르기</h3>
  <p id="scanInfo" class="hint"></p>
  <div id="orgList"></div>
</div>

<div id="doneCard" class="card" style="display:none"></div>

<script>
const LOGO_URL = "https://res.cloudinary.com/x4eukv2d/image/upload/v1793915754/cheongryang-high-logo.png";
const MASTER_EMAIL = "coconut123456765@gmail.com";
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
const $ = id => document.getElementById(id);
function setStatus(t){ $("status").textContent = t; }

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const cloudRef = db.ref("wiki");
let isMaster = false;

firebase.auth().onAuthStateChanged(user=>{
  isMaster = !!(user && user.email === MASTER_EMAIL);
  if (isMaster){ $("loginCard").style.display = "none"; loadOrgs(); }
  else { $("loginCard").style.display = "block"; setStatus("마스터 로그인이 필요해요. 위에서 로그인해주세요."); }
});

$("loginBtn").onclick = async ()=>{
  const em = $("loginEmail").value.trim();
  const pw = $("loginPw").value;
  const err = $("loginErr"); err.style.display = "none";
  try{ await firebase.auth().signInWithEmailAndPassword(em, pw); }
  catch(e){ err.textContent = "로그인 실패: " + (e && e.message); err.style.display = "block"; }
};

async function loadOrgs(){
  setStatus("도시 데이터 읽는 중…");
  try{
    const snap = await cloudRef.once("value");
    const v = snap.val();
    if (!v || !v.store){ setStatus("도시 데이터가 없어요."); return; }
    const worlds = Object.entries(v.store).filter(([k,w])=>w && typeof w === "object" && typeof w.name === "string");
    const target = worlds.filter(([k,w])=>String(w.name).includes("청량고"));
    if (!target.length){
      setStatus("청량고 세계관을 못 찾았어요. 세계관 " + worlds.length + "개: " + worlds.map(([,w])=>w.name).join(", "));
      return;
    }
    let orgs = [];
    target.forEach(([wk,w])=>{
      (Array.isArray(w.groups) ? w.groups : []).forEach(g=>{
        if (g && g.kind === "org") orgs.push({worldKey: wk, worldName: w.name, g});
      });
    });
    $("scanInfo").textContent = "세계관 " + worlds.length + "개 스캔, 청량고 세계관 " + target.length + "개, 조직 " + orgs.length + "개 찾았어요.";
    if (!orgs.length){ setStatus("청량고 세계관 안에 조직이 없어요."); return; }
    const list = $("orgList"); list.innerHTML = "";
    orgs.forEach(({worldKey, worldName, g})=>{
      const row = document.createElement("div"); row.className = "org";
      row.innerHTML = '<img src="' + (g.logo ? g.logo.replace(/ /g,"%20") : "") + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="nm"><b>' + esc(g.name) + '</b><br><span class="hint">' + esc(worldName) + ' · 로고 ' + (g.logo ? '있음' : '없음') + '</span></div>';
      const btn = document.createElement("button"); btn.textContent = "이 조직 로고로 설정";
      btn.onclick = ()=>applyLogo(worldKey, g.id, g.name, orgs.length, worlds.length);
      row.appendChild(btn); list.appendChild(row);
    });
    $("orgCard").style.display = "block";
    setStatus("조직을 골라주세요. 누르면 로고만 바뀌어요.");
  }catch(e){ setStatus("읽기 실패: " + (e && e.message)); }
}
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function applyLogo(worldKey, groupId, groupName, orgCount, worldCount){
  if (!confirm("'" + groupName + "' 조직의 로고를 청량고등학교 로고로 바꿀까요? 로고 외에는 아무것도 안 바뀌어요.")) return;
  setStatus("저장 중…");
  try{
    // 쓰기 직전에 최신 데이터를 다시 읽어서, 그 위에 로고만 바꿈
    const snap = await cloudRef.once("value");
    const v = snap.val();
    if (!v || !v.store || !v.store[worldKey]){ setStatus("데이터가 바뀌었어요. 새로고침하고 다시 해주세요."); return; }
    const w = v.store[worldKey];
    const g = (Array.isArray(w.groups) ? w.groups : []).find(x=>x && x.id === groupId);
    if (!g){ setStatus("조직을 못 찾았어요. 새로고침하고 다시 해주세요."); return; }
    g.logo = LOGO_URL;
    if (v.store._updatedAt) delete v.store._updatedAt;
    const storeUpdatedAt = Date.now();
    let backups = Array.isArray(v.backups) ? v.backups : [];
    try{
      const storeStr = JSON.stringify(v.store);
      const last = backups[backups.length - 1];
      if (!last || JSON.stringify(last.store) !== storeStr){
        backups.push({ t: storeUpdatedAt, store: JSON.parse(storeStr) });
        while (backups.length > 5) backups.shift();
      }
    }catch(e){}
    await cloudRef.set({ store: v.store, theme: v.theme || "light", storeUpdatedAt, backups });
    $("orgCard").style.display = "none";
    const done = $("doneCard");
    done.innerHTML = '<p class="ok">DONE: \'' + esc(groupName) + '\' 조직 로고를 청량고등학교 로고로 바꿨어요.</p>' +
      '<p>스캔한 세계관 ' + worldCount + '개, 조직 ' + orgCount + '개. 로고: <a href="' + LOGO_URL + '" target="_blank">cheongryang-high-logo.png</a></p>' +
      '<p class="hint">도시 위키를 새로고침하면 로고가 보여요.</p>';
    done.style.display = "block";
    setStatus("완료!");
  }catch(e){ setStatus("저장 실패: " + (e && e.message)); }
}
</script>
</body>
</html>
