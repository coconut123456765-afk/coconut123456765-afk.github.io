<style>
  :root, html[data-theme="dark"] {
    --bg:#1a1d26; --panel:#232836; --line:#343b4f; --txt:#e8eaf0; --dim:#9aa3b8; --acc:#7fb4ff; --warm:#ffc98a;
    --input-bg:#141821; --plabel-bg:#1a2233; --paper:#111726; --ruled:rgba(140,170,220,0.07);
    --hole-in:#05080f; --hole-ring:#46536e; --badge-bg:#5a3d1e; --on-acc:#101623;
  }
  html[data-theme="light"] {
    --bg:#f5f2ec; --panel:#ffffff; --line:#ddd6c8; --txt:#2c2822; --dim:#8a8172; --acc:#1a6fb5; --warm:#8a5a1e;
    --input-bg:#ffffff; --plabel-bg:#efe9db; --paper:#fffdf7; --ruled:rgba(120,100,70,0.10);
    --hole-in:#e6dfcf; --hole-ring:#b3a88f; --badge-bg:#f0e2c8; --on-acc:#ffffff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:"Pretendard","Apple SD Gothic Neo",sans-serif; line-height:1.6; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  .demo-badge { background:var(--badge-bg); color:var(--warm); font-size:12px; padding:3px 10px; border-radius:20px; }
  .worlds { display:flex; gap:8px; margin-left:auto; }
  .worlds button, .tabs button, .chars button { cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--txt); padding:8px 14px; border-radius:10px; font-size:14px; }
  .worlds button.on, .tabs button.on, .chars button.on { background:var(--acc); color:var(--on-acc); border-color:var(--acc); font-weight:700; }
  main { display:flex; min-height:calc(100vh - 70px); }
  aside { width:230px; border-right:1px solid var(--line); padding:14px; }
  aside h3 { font-size:13px; color:var(--dim); margin:4px 0 10px; }
  .chars { display:flex; flex-direction:column; gap:6px; }
  .chars button { text-align:left; display:flex; align-items:center; gap:10px; }
  .char-row { display:flex; align-items:center; gap:4px; }
  .char-row .char-sel { flex:1; min-width:0; }
  .char-order { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .char-order button { width:20px; height:15px; font-size:8px; line-height:1; padding:0; border:1px solid var(--line); background:var(--panel); color:var(--dim); border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .char-order button:hover:not(:disabled) { color:var(--acc); border-color:var(--acc); }
  .char-order button:disabled { opacity:0.2; cursor:default; }
  .char-meta { display:flex; flex-direction:column; min-width:0; flex:1; }
  .char-name { font-size:14px; }
  .char-sub { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .char-item-img { margin:2px 0 8px; border-radius:10px; overflow:hidden; border:1px solid var(--line); aspect-ratio:1/1; max-height:280px; }
  .char-item-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .char-thumb { cursor:pointer; }
  .gal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-top:10px; }
  .gal-item { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .gal-item img { width:100%; height:200px; object-fit:cover; display:block; cursor:zoom-in; }
  .gal-title { padding:6px 8px; font-size:12px; color:var(--txt); }
  .gal-edrow { display:flex; align-items:center; gap:8px; margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:10px; }
  .gal-edimg { width:56px; height:56px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .gal-edtitle { flex:1; }
  .char-thumb { width:32px; height:32px; border-radius:50%; background:var(--plabel-bg); color:var(--dim); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; overflow:hidden; }
  .char-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .chars-head { display:flex; align-items:center; justify-content:space-between; margin:4px 0 10px; }
  .chars-head h3 { font-size:13px; color:var(--dim); margin:0; }
  .chars-tools { display:flex; gap:6px; }
  .chars-tools button { width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:15px; line-height:1; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; }
  .chars-tools button:hover { color:var(--txt); border-color:var(--acc); }
  .chars-tools #delChar:hover { color:#e06c75; border-color:#e06c75; }
  section { flex:1; padding:20px 26px; max-width:760px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; color:var(--dim); margin-bottom:5px; }
  .field .val { font-size:16px; }
  .field input, .field textarea, .field select { width:100%; background:var(--input-bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:15px; }
  .field textarea { min-height:90px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .rel { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .rel select { flex:1; }
  .rel button { border:1px solid var(--line); background:var(--panel); color:var(--txt); border-radius:8px; padding:8px 10px; cursor:pointer; }

  .val.overview { font-size:17px; border-left:3px solid var(--acc); padding-left:12px; }
  .val.foldable { max-height:4.8em; overflow:hidden; }
  .val.foldable.open { max-height:none; }
  .foldbtn { background:none; border:1px solid var(--line); color:var(--acc); border-radius:8px; padding:8px 14px; margin-top:8px; cursor:pointer; font-size:14px; }
  .navbox { margin-top:26px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .navbox-title { background:var(--plabel-bg); padding:10px 14px; font-weight:700; font-size:14px; }
  .navbox-links { padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px; }
  .navbox-links button { background:var(--plabel-bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  .navbox-links button:hover { border-color:var(--acc); }

  .quotebanner { background:#1a6fb5; color:#fff; text-align:center; padding:12px 14px; border-radius:10px; font-weight:600; font-size:16px; }
  .bigname { font-size:24px; font-weight:800; }
  .ptable { width:100%; border-collapse:collapse; font-size:15px; margin-top:4px; table-layout:fixed; }
  .ptable td { overflow-wrap:break-word; }
  .ptable td { border:1px solid var(--line); padding:8px 10px; vertical-align:top; }
  .ptable td.plabel { background:var(--plabel-bg); font-weight:700; width:24%; }
  .ptable input { width:100%; background:var(--input-bg); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:7px 9px; font-size:15px; box-sizing:border-box; }
  .colorchip { display:inline-block; max-width:100%; box-sizing:border-box; overflow:hidden; color:#fff; padding:3px 12px; border-radius:6px; font-size:13px; font-weight:600; white-space:nowrap; }
  .val.overview { font-size:16px; }
  @media (max-width:700px){ .ptable{font-size:14px;} .ptable td{padding:7px 8px;} .bigname{font-size:21px;} .colorchip{padding:2px 8px;font-size:12px;} }

  .notebook { position:relative; border:1px solid var(--line); border-radius:12px; padding:20px 20px 20px 58px;
    background-color:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 30px, var(--ruled) 30px, var(--ruled) 31px); }
  .notebook::before { content:""; position:absolute; left:12px; top:16px; bottom:16px; width:24px;
    background-image:radial-gradient(circle, var(--hole-in) 0 5px, var(--hole-ring) 5px 6px, transparent 6.5px);
    background-size:24px 38px; background-repeat:repeat-y; }
  .notebook::after { content:""; position:absolute; top:0; bottom:0; left:48px; width:2px; background:rgba(255,110,110,0.22); }
  @media (max-width:700px){ .notebook{padding:16px 14px 16px 46px;} .notebook::before{left:8px;} .notebook::after{left:38px;} }


  .hdr-btn { cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--txt); padding:8px 14px; border-radius:10px; font-size:14px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50; padding:20px; align-items:center; justify-content:center; }
  .modal-panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; width:340px; max-width:100%; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-head b { font-size:17px; }
  .setting-row { margin-bottom:16px; }
  .setting-row > label { display:block; font-size:13px; color:var(--dim); margin-bottom:8px; }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--txt); padding:10px; border-radius:10px; font-size:14px; }
  .seg button.on { background:var(--acc); color:var(--on-acc); border-color:var(--acc); font-weight:700; }
  .acc-row { display:flex; gap:8px; align-items:center; }
  .hint { font-size:12px; color:var(--dim); margin:8px 0 0; }

  .wikilink { color:var(--acc); text-decoration:underline; cursor:pointer; }
  .field .val { white-space:pre-wrap; }
  .topnav { margin-bottom:14px; font-size:13px; color:var(--dim); }
  .topnav a { color:var(--acc); cursor:pointer; margin:0 6px; }

  .worldrow { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .worldrow input[type="text"] { flex:1; min-width:0; background:var(--input-bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 10px; font-size:14px; }
  .worldrow input[type="color"] { width:34px; height:34px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); cursor:pointer; flex-shrink:0; }

function pickText(hex){
  const c = String(hex||"#000000").replace("#","");
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return ((0.299*r + 0.587*g + 0.114*b)/255) > 0.6 ? "#101623" : "#ffffff";
}
function worldAccent(){

let cloudRef = null, cloudReady = false, cloudCache = "";
function saveLocal(){
  try{ localStorage.setItem("don_wiki", JSON.stringify({ store, theme })); }
  catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem("don_wiki");
    if (raw){
      const st = JSON.parse(raw);
      if (st && st.store) store = st.store;
      if (st && st.theme) theme = st.theme;
    }
  }catch(e){}
}
function cloudPush(){
  if (!cloudReady || !cloudRef) return;
  const data = JSON.stringify({ store, theme });
  cloudCache = data;
  try{ cloudRef.set(JSON.parse(data)); }catch(e){}
}
function persist(){
  saveLocal();
  cloudPush();
}
function initCloud(){
  try{
    firebase.initializeApp(firebaseConfig);
    cloudRef = firebase.database().ref("wiki");
    firebase.auth().signInAnonymously().then(()=>{
      cloudRef.once("value").then(snap=>{
        if (!snap.exists()) cloudPush();
      });
      cloudRef.on("value", snap=>{
        const v = snap.val();
        if (!v || !v.store) return;
        const data = JSON.stringify({ store: v.store, theme: v.theme });
        if (data === cloudCache) return;
        cloudCache = data;
        if (editingTab) return; // 편집 중이면 덮어쓰지 않음
        store = v.store;
        if (v.theme) theme = v.theme;
        if (!store[curWorld]) curWorld = Object.keys(store)[0];
        const chars = store[curWorld] ? store[curWorld].chars : [];
        if (curChar && !chars.some(c=>c.id===curChar)) curChar = chars.length ? chars[0].id : null;
        saveLocal();
        applyTheme(); render();
      });
      cloudReady = true;
    }).catch(()=>{});
  }catch(e){}
}
function deriveStarsign(birthday){
  const s = String(birthday||"");
  let m = s.match(/(\d{1,2})\s*월\s*(\d{1,2})/) || s.match(/(\d{1,2})[\/.\-](\d{1,2})/) || s.match(/^(\d{2})(\d{2})$/);
  if (!m) return "";
  const mo = +m[1], d = +m[2];
  if (mo<1||mo>12||d<1||d>31) return "";
  const t = mo*100+d;
  if (t>=321&&t<=419) return "양자리";
  if (t>=420&&t<=520) return "황소자리";
  if (t>=521&&t<=621) return "쌍둥이자리";
  if (t>=622&&t<=722) return "게자리";
  if (t>=723&&t<=822) return "사자자리";
  if (t>=823&&t<=923) return "처녀자리";
  if (t>=924&&t<=1022) return "천칭자리";
  if (t>=1023&&t<=1122) return "전갈자리";
  if (t>=1123&&t<=1224) return "사수자리";
  if (t>=1225||t<=119) return "염소자리";
  if (t>=120&&t<=218) return "물병자리";
  if (t>=219&&t<=320) return "물고기자리";
  return "";
}

let curWorld = "hotel", curChar = null, curTab = "profile", editingTab = null, editBackup = null
function cancelEdit(){
  if (editingTab && editBackup){
    const w = store[curWorld];
    if (w){ const i = w.chars.findIndex(x=>x.id===editBackup.id); if (i>=0) w.chars[i] = editBackup; }
  }
  editingTab = null; editBackup = null;
}
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur = () => store[curWorld].chars.find(c=>c.id===curChar);
const nameOf = id => { for (const w of Object.values(store)){ const c=w.chars.find(c=>c.id===id); if(c) return c.profile.name||"(이름 없음)"; } return "?"; };
function charThumb(c){
  const clean = String(c.profile.name||"").replace(/^\(샘플\)\s*/, "").trim();
  const initial = clean.charAt(0) || "?";
  const bg = c.color ? ` style="background:${esc(c.color)};color:${pickText(c.color)}"` : "";
  if (c.thumb) return `<span class="char-thumb"${bg}><img src="${esc(c.thumb)}" alt=""></span>`;
  return `<span class="char-thumb"${bg}>${esc(initial)}</span>`;
}
function findCharById(id){
  for (const [wk,w] of Object.entries(store)) if (w.chars.some(c=>c.id===id)) return { id, world:wk };
  return null;
}
function findCharByName(name){
  const norm = s => String(s||"").replace(/^\(샘플\)\s*/,"").trim();
  const n = norm(name);
  if (!n) return null;
  for (const [wk,w] of Object.entries(store)) for (const c of w.chars)
    if (norm(c.profile.name)===n) return { id:c.id, world:wk };
  for (const [wk,w] of Object.entries(store)) for (const c of w.chars)
    if (norm(c.profile.name).includes(n)) return { id:c.id, world:wk };
  return null;
}
function linkify(text){
  return String(text||"").split(/(\[\[[^\]]+\]\])/g).map(part=>{
    const m = part.match(/^\[\[([^\]]+)\]\]$/);
    if (!m) return esc(part);
    const name = m[1].trim();
    const t = findCharByName(name);
    if (t) return `<a class="wikilink" data-link="${t.id}">${esc(name)}</a>`;
    return esc(name);
  }).join("");
}
function gotoChar(id){
  const t = findCharById(id);
  if (!t) return;
  if (t.world!==curWorld) curWorld = t.world;
  curChar = t.id; curTab = "profile"; render(); window.scrollTo(0,0);
}


function moveChar(id, dir){
  const chars = store[curWorld].chars;
  const i = chars.findIndex(c=>c.id===id);
  const j = i + dir;
  if (i<0 || j<0 || j>=chars.length) return;
  const t = chars[i]; chars[i] = chars[j]; chars[j] = t;
  persist(); render();
}
function render(){
  // 세계관 버튼
  $("worlds").innerHTML = Object.entries(store).map(([k,w])=>
    `<button class="${k===curWorld?"on":""}" data-w="${k}">${esc(w.name)}</button>`).join("");
  document.querySelectorAll("#worlds button").forEach(b=>b.onclick=()=>{cancelEdit(); curWorld=b.dataset.w; curChar=store[curWorld].chars[0]?.id||null; curTab="profile"; render();});
  // 캐릭터 목록
  $("chars").innerHTML = store[curWorld].chars.map((c,i,arr)=>{
    const relNames = (c.rels||[]).map(r=>nameOf(r.to)).filter(n=>n&&n!=="?");
    const sub = [c.position||"", relNames.length?"→ "+relNames.join(", "):""].filter(Boolean).join(" · ");
    const img = (c.illust||"").split("\n").find(x=>x.trim()) || c.thumb;
    const subHtml = sub ? '<span class="char-sub">'+esc(sub)+'</span>' : "";
    const imgHtml = (c.id===curChar && img) ? '<div class="char-item-img"><img src="'+esc(img)+'" alt=""></div>' : "";
    const selOn = c.id===curChar ? "on" : "";
    const disUp = i===0 ? " disabled" : "";
    const disDown = i===arr.length-1 ? " disabled" : "";
    const cname = esc(c.profile.name||"(이름 없음)");
    return '<div class="char-row"><button class="char-sel '+selOn+'" data-c="'+c.id+'">'+charThumb(c)+'<span class="char-meta"><span class="char-name">'+cname+'</span>'+subHtml+'</span></button>'+
    '<span class="char-order"><button data-up="'+c.id+'" title="위로"'+disUp+'>▲</button><button data-down="'+c.id+'" title="아래로"'+disDown+'>▼</button></span></div>'+imgHtml;
  }).join("");
  document.querySelectorAll("#chars [data-c]").forEach(b=>b.onclick=()=>{cancelEdit(); curChar=b.dataset.c; curTab="profile";  render();});
  document.querySelectorAll("#chars [data-up]").forEach(b=>b.onclick=e=>{e.stopPropagation(); moveChar(b.dataset.up,-1);});
  document.querySelectorAll("#chars [data-down]").forEach(b=>b.onclick=e=>{e.stopPropagation(); moveChar(b.dataset.down,1);});

  // 탭 (무기 탭은 판타지 호텔에만)
  const tabs = TABS.filter(([k])=> k!=="weapon" || store[curWorld].hasWeapon);
  if (!tabs.some(([k])=>k===curTab)) curTab = "profile";
  $("tabs").innerHTML = tabs.map(([k,n])=>`<button class="${k===curTab?"on":""}" data-t="${k}">${n}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{cancelEdit(); curTab=b.dataset.t; render();});
  const c = cur();
  $("sampleNote").style.display = (c && c.sample) ? "" : "none";
  let bodyH = "";
  bodyH += c ? renderTab(c) : `<p class="empty">캐릭터를 선택하세요.</p>`;
  if (c){
    const others = store[curWorld].chars.filter(x=>x.id!==c.id);
    if (others.length){
      bodyH += `<div class="navbox"><div class="navbox-title">둘러보기 — ${esc(store[curWorld].name)}</div><div class="navbox-links">`;
      others.forEach(o=>{ bodyH += `<button data-nav="${o.id}">${esc(o.profile.name||"(이름 없음)")}</button>`; });
      bodyH += `</div></div>`;
    }
  }
  $("body").innerHTML = bodyH;
  document.querySelectorAll("[data-link]").forEach(a=>{ a.onclick = ()=>gotoChar(a.dataset.link); });
  const fb = $("foldBtn");
  if (fb) fb.onclick = ()=>{
    const v = $("foldCustom");
    const open = v.classList.toggle("open");
    fb.textContent = open ? "접기 ▴" : "펼치기 ▾";
  };
  document.querySelectorAll("[data-nav]").forEach(b=>{ b.onclick = ()=>gotoChar(b.dataset.nav); });
  if (editingTab) bindEdit(c);
  const te = $("tabEdit");
  if (te) te.onclick = ()=>{ editingTab = curTab; editBackup = JSON.parse(JSON.stringify(cur())); render(); };
  const ts = $("tabSave");
  if (ts) ts.onclick = ()=>{ persist(); editingTab = null; editBackup = null; render(); };
  const tc = $("tabCancel");
  if (tc) tc.onclick = ()=>{ cancelEdit(); render(); };
  applyAccent();
}

function fieldRow(label, val, key, type, ed){
  if (!ed){
    return `<div class="field"><label>${label}</label><div class="val">${esc(val)||'<span class="empty">—</span>'}</div></div>`;
  }
  const input = type==="area"
    ? `<textarea data-k="${key}">${esc(val)}</textarea>`
    : `<input data-k="${key}" value="${esc(val)}">`;
  return `<div class="field"><label>${label}</label>${input}</div>`;
}

function renderTab(c){
  const bar = editingTab === curTab
    ? `<div class="tab-editbar"><button class="hdr-btn acc" id="tabSave">저장</button><button class="hdr-btn" id="tabCancel">취소</button></div>`
    : `<div class="tab-editbar"><button class="hdr-btn" id="tabEdit">수정</button></div>`;

}
function relMindmap(c){

    return `<g class="mm-node" data-nav="${id}" style="cursor:pointer">${inner}`
      + `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--acc)" stroke-width="2"/>`
      + `<text x="${x}" y="${y+r+16}" text-anchor="middle" font-size="12" fill="var(--txt)">${name}</text></g>`;
  };
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="mm-svg" style="width:100%;max-width:440px;display:block;margin:0 auto 10px">`;
  rels.forEach((r,i)=>{
    const ch = findCharById(r.to);
    if (!ch) return;
    const target = store[ch.world].chars.find(x=>x.id===ch.id);
    if (!target) return;
    const ang = (2*Math.PI*i/rels.length) - Math.PI/2;
    const x = cx + R*Math.cos(ang), y = cy + (R*0.85)*Math.sin(ang);
    const kind = REL_KINDS[r.kind]||r.kind;
    const mx = (cx+x)/2, my = (cy+y)/2;
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1.5"/>`;
    svg += `<rect x="${mx-24}" y="${my-10}" width="48" height="20" rx="10" fill="var(--panel)" stroke="var(--line)"/>`;
    svg += `<text x="${mx}" y="${my+4}" text-anchor="middle" font-size="11" fill="var(--dim)">${esc(kind)}</text>`;
    svg += nodeImg(target, x, y, 26, r.to);
  });
  svg += nodeImg(c, cx, cy, 32, c.id);
  svg += `</svg>`;
  return svg;
}

}

function bindEdit(c){
  document.querySelectorAll("#body [data-k]").forEach(el=>{
    el.oninput = ()=>{
      const k = el.dataset.k;
      const v = el.type==="checkbox" ? el.checked : el.value;
      if (k.startsWith("profile.")) c.profile[k.slice(8)] = v; else c[k] = v;
    };
  });
  document.querySelectorAll(".rel-del").forEach(b=>b.onclick=()=>{ c.rels.splice(+b.closest(".rel").dataset.i,1); render(); });
  document.querySelectorAll(".rel-to").forEach(s=>s.onchange=()=>{ c.rels[+s.closest(".rel").dataset.i].to = s.value; });
  document.querySelectorAll(".rel-kind").forEach(s=>s.onchange=()=>{ c.rels[+s.closest(".rel").dataset.i].kind = s.value; });
  const add = $("relAdd"); if (add) add.onclick = ()=>{ const other = Object.values(store).flatMap(w=>w.chars).find(x=>x.id!==c.id); if(other){ c.rels.push({to:other.id, kind:"friend"}); render(); } };
  const sf = $("illustFile");
  if (sf) sf.onchange = async ()=>{
    const f = sf.files[0]; if (!f) return;
    c.illust = await fileToDataURL(f);
    const inp = document.querySelector('#body [data-k="illust"]'); if (inp) inp.value = c.illust;
  };
  const sc = $("illustClear");
  if (sc) sc.onclick = ()=>{ c.illust = ""; const inp = document.querySelector('#body [data-k="illust"]'); if (inp) inp.value = ""; };
  const tf = $("thumbFile");
  if (tf) tf.onchange = async ()=>{
    const f = tf.files[0]; if (!f) return;
    c.thumb = await fileToDataURL(f, 256, 0.8);
    let pv = $("thumbPreview");
    if (pv){ pv.src = c.thumb; }
    else {
      pv = document.createElement("img");
      pv.id = "thumbPreview"; pv.src = c.thumb;
      pv.style.cssText = "width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin-bottom:8px";
      tf.closest(".field").insertBefore(pv, tf.closest("div"));
    }
  };
  const tc2 = $("thumbClear");
  if (tc2) tc2.onclick = ()=>{ c.thumb = ""; const pv = $("thumbPreview"); if (pv) pv.remove(); tc2.remove(); };
  const lf = $("logoFile");
  if (lf) lf.onchange = async ()=>{
    const f = lf.files[0]; if (!f) return;
    c.logo = await fileToDataURL(f, 800, 0.85);
    let pv = $("logoPreview");
    if (pv){ pv.src = c.logo; }
    else {
      pv = document.createElement("img");
      pv.id = "logoPreview"; pv.src = c.logo;
      pv.style.cssText = "max-width:220px;border-radius:8px;display:block;margin-bottom:8px";
      lf.closest(".field").insertBefore(pv, lf.closest("div"));
    }
  };
  const lc2 = $("logoClear");
  if (lc2) lc2.onclick = ()=>{ c.logo = ""; const pv = $("logoPreview"); if (pv) pv.remove(); lc2.remove(); };
  const mf = $("illustFiles");
  if (mf) mf.onchange = async ()=>{
    for (const f of mf.files){
      const url = await fileToDataURL(f);
      c.illust = (c.illust ? c.illust + "\n" : "") + url;
    }
    render();
  };
  document.querySelectorAll("[data-ildel]").forEach(b=>b.onclick=()=>{
    const lines = String(c.illust||"").split("\n").map(s=>s.trim()).filter(Boolean);
    lines.splice(+b.dataset.ildel,1);
    c.illust = lines.join("\n");
    render();
  });
  ["wardrobeImgs","weaponImgs"].forEach(imgKey=>{
    const gf = $("gal-file-"+imgKey);
    if (gf) gf.onchange = async ()=>{
      const f = gf.files[0]; if (!f) return;
      const url = await fileToDataURL(f);
      if (!c[imgKey]) c[imgKey] = [];
      c[imgKey].push({img:url, title:""});
      render();
    };
  });
  document.querySelectorAll(".gal-edtitle").forEach(inp=>inp.onchange=()=>{
    const row = inp.closest(".gal-edrow"); if (!row) return;
    const key = inp.closest(".gal-edit").id.replace("gal-","");
    const i = +inp.dataset.gi;
    if (c[key] && c[key][i]) c[key][i].title = inp.value;
  });
  document.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>{
    const row = b.closest(".gal-edrow"); if (!row) return;
    const key = b.closest(".gal-edit").id.replace("gal-","");
    const i = +b.dataset.gdel;
    if (c[key]) c[key].splice(i,1);
    render();
  });
  document.querySelectorAll(".gal-item img, img.zoomable, .gal-edimg").forEach(img=>{
    img.style.cursor = "zoom-in";
  });
  const lb = $("lightbox");
  if (lb) lb.onclick = ()=>{ lb.style.display = "none"; };
}
function openLightbox(src){
  const lb = document.getElementById("lightbox");
  const im = document.getElementById("lightboxImg");
  if (lb && im){ im.src = src; lb.style.display = "flex"; }
}
function fileToDataURL(file, maxW, quality){
  maxW = maxW || 1200; quality = quality || 0.85;
  return new Promise((resolve, reject)=>{
    if (file.type==="image/png" && file.size < 800*1024 && maxW >= 1200){
      const r = new FileReader();
      r.onload = ()=>resolve(r.result); r.onerror = reject;
      r.readAsDataURL(file); return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if (w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

  });
  wl.querySelectorAll("[data-wdel]").forEach(btn=>{
    btn.onclick = ()=>{

      delete store[wid];
      if (curWorld===wid){ curWorld = Object.keys(store)[0]; curChar = store[curWorld].chars[0]?.id||null; }
      render(); renderWorldList();
    };
  });
}

document.getElementById("importFile").onchange = (e)=>{
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if (!d.worlds) throw new Error("bad");
      cancelEdit();
      store = d.worlds;
      curWorld = Object.keys(store)[0] || null;
      curChar = curWorld ? (store[curWorld].chars[0]?.id || null) : null;
      curTab = "profile";
      persist(); render();
    }catch(err){ alert("가져오기 실패: 올바른 백업 파일이 아니에요."); }
  };
  r.readAsText(f); e.target.value = "";
};
modal.addEventListener("click", (e)=>{ if (e.target===modal) modal.style.display = "none"; });
applyTheme(); applyAccent();
curChar = store[curWorld].chars[0]?.id || null;
