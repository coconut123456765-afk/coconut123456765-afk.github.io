<!DOCTYPE html><html><head><meta charset="utf-8"><title>saloon-fix2</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body>
<input id="em" placeholder="email"><input id="pw" type="password" placeholder="password">
<button id="go">살룬 상급자 초기화</button><pre id="log"></pre><script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const logEl=document.getElementById('log');
function log(s){ logEl.textContent += "\n" + s; }
document.getElementById('go').onclick = async ()=>{
  try{
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    const ref = firebase.database().ref("wiki");
    const snap = await ref.once("value");
    const v = snap.val()||{};
    const store = v.store||{};
    const w = store["hotel"];
    log("BEFORE hotel chars="+(w.chars||[]).length);
    (w.chars||[]).forEach(c=>{ log("  BEFORE "+(c.profile&&c.profile.name)+" id="+c.id+" groupIds="+JSON.stringify(c.groupIds||[])+" sup="+JSON.stringify(c.groupSuperior||{})+" superiorId="+(c.superiorId||"")); c.groupSuperior={}; c.superiorId=null; });
    v.store = store; v.storeUpdatedAt = Date.now();
    await ref.set(v);
    log("AFTER all Saloon superiors cleared, chars="+(w.chars||[]).length);
    (w.chars||[]).forEach(c=>{ log("  AFTER "+(c.profile&&c.profile.name)+" groupIds="+JSON.stringify(c.groupIds||[])); });
    log("DONE");
  }catch(e){ log("ERR "+e.message); }
};
</script></body></html>
