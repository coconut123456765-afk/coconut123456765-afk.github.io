<!DOCTYPE html>
<!-- Atelier:Don build -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier:Don</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f3f0;--surface:#fffdf8;--border:#ddd5cf;--accent:#9b3a3a;--text:#2a1f1f;--muted:#9c8a84;--danger:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:10}
  .brand{font-family:"Special Elite","Courier New",monospace;font-size:24px;letter-spacing:2px}
  .brand .c{color:var(--accent)} .brand .d{border-bottom:2px solid var(--accent);padding-bottom:1px}
  .sub{font-family:"Special Elite",monospace;font-size:10px;letter-spacing:4px;color:var(--muted);margin-top:2px}
  .hdr-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
  .hdr-btn:hover{color:var(--accent);border-color:var(--accent)}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#4caf7d;box-shadow:0 0 6px #4caf7d}
  .sync-dot.syncing{background:#f7c46a;box-shadow:0 0 6px #f7c46a}
  .sync-dot.offline{background:var(--danger);box-shadow:0 0 6px var(--danger)}
  #setupScreen{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--border);border-radius:16px;padding:36px}
  #setupScreen h2{font-size:22px;font-weight:800;margin-bottom:8px}
  #setupScreen p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:24px}
  .setup-label{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted);margin-top:20px}
  .setup-input{width:100%;background:#f0ebe7;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;margin-bottom:10px}
  .btn-setup{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
  .setup-error{color:var(--danger);font-size:13px;margin-top:8px;display:none}
  #app{display:none}
  .wrap{display:flex;gap:24px;padding:24px;align-items:flex-start}
  .left{width:360px;flex-shrink:0;position:sticky;top:89px}
  .base-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(42,31,31,.06)}
  .base-card img{width:100%;display:block;background:#d8d8d8}
  .base-name{padding:14px 16px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:17px}
  .base-note{padding:0 16px 14px;color:var(--muted);font-size:12px;line-height:1.7}
  .right{flex:1;min-width:0}
  .right-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sec-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:900;letter-spacing:2px;padding-bottom:8px;border-bottom:2px solid var(--accent);display:inline-block}
  .btn-add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}
  .btn-add:hover{background:#7a2d2d}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;transition:border-color .15s,transform .15s,box-shadow .15s}
  .tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(155,58,58,.12)}
  .tile-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
  .tile-img-empty{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:#f0ebe7}
  .tile-body{padding:12px 14px}
  .tile-name{font-family:'Noto Serif KR',serif;font-weight:700;font-size:15px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-prompt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
  .tile-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
  .tile:hover .tile-actions{opacity:1}
  .icon-btn{background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--muted)}
  .icon-btn:hover{color:var(--danger)}
  .empty{text-align:center;padding:60px 0;color:var(--muted);grid-column:1/-1;line-height:1.8}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.show{opacity:1;pointer-events:all}
  .modal{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;width:420px;max-width:94vw;max-height:92vh;overflow-y:auto}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:16px}
  .modal label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}
  .modal input,.modal textarea{width:100%;background:#f0ebe7;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;outline:none;margin-bottom:14px;font-family:'Noto Sans KR',sans-serif}
  .modal textarea{font-family:'JetBrains Mono',monospace;line-height:1.6;min-height:110px;resize:vertical}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end}
  .btn-cancel{background:#f0ebe7;border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
  .btn-confirm{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
  .img-preview{width:100%;max-height:180px;object-fit:cover;border-radius:8px;display:none;margin-bottom:14px}
  .img-preview.show{display:block}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:10px 22px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:760px){.wrap{flex-direction:column}.left{width:100%;position:static}}
</style>
</head>
<body>
<div id="setupScreen">
  <h2><span class="brand">Atelier<span class="c">:</span><span class="d">Don</span></span> 설정</h2>
  <p>Firebase를 연결하면 어느 기기에서도 같은 옷장 타일을 쓸 수 있어요.<br>Scroll:Don을 이미 설정한 브라우저라면, 아래 값은 Scroll과 같은 값이에요.</p>
  <div class="setup-label">apiKey</div>
  <input class="setup-input" id="f_apiKey" placeholder="AIzaSy...">
  <div class="setup-label">authDomain</div>
  <input class="setup-input" id="f_authDomain" placeholder="your-project.firebaseapp.com">
  <div class="setup-label">projectId</div>
  <input class="setup-input" id="f_projectId" placeholder="your-project-id">
  <button class="btn-setup" onclick="saveConfig()">연결하기</button>
  <div class="setup-error" id="setupError">값을 모두 입력해주세요.</div>
</div>

<div id="app">
<header>
  <div><div class="brand">Atelier<span class="c">:</span><span class="d">Don</span></div><div class="sub">WARDROBE · ONLINE</div></div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="sync-dot" id="syncDot" title="동기화 상태"></div>
    <button class="hdr-btn" onclick="exportTiles()">내보내기</button>
    <label class="hdr-btn" style="cursor:pointer">가져오기<input type="file" id="importFile" accept="application/json" style="display:none"></label>
    <button class="hdr-btn" onclick="resetConfig()">연결 해제</button>
  </div>
</header>

<div class="modal-overlay" id="tileModal">
  <div class="modal">
    <h3 id="tileModalTitle">타일 추가</h3>
    <label>옷 이름</label>
    <input id="tileName" placeholder="예: 겨울 코트">
    <label>프롬 (타일을 누르면 이 내용이 복사돼요)</label>
    <textarea id="tilePrompt" placeholder="옷 프롬을 적어주세요"></textarea>
    <label>대표 이미지 (선택, 올리면 자동으로 400px JPEG로 줄여서 저장돼요)</label>
    <input type="file" id="tileImage" accept="image/*">
    <img id="tileImagePreview" class="img-preview" alt="">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTileModal()">취소</button>
      <button class="btn-confirm" onclick="saveTile()">저장</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">클립보드에 복사됨 ✓</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const CONFIG_KEY = 'atelier_firebase_config';
  const SCROLL_KEY = 'yurang_firebase_config';
  let db, tiles = [];
  let editId = null;
  let pendingImage = null;

  function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function setSyncDot(state){
    const dot = document.getElementById('syncDot');
    if (!dot) return;
    dot.className = 'sync-dot' + (state !== 'ok' ? ' ' + state : '');
  }

  window.saveConfig = function(){
    const apiKey = document.getElementById('f_apiKey').value.trim();
    const authDomain = document.getElementById('f_authDomain').value.trim();
    const projectId = document.getElementById('f_projectId').value.trim();
    const err = document.getElementById('setupError');
    if (!apiKey || !authDomain || !projectId){ err.style.display = 'block'; return; }
    err.style.display = 'none';
    localStorage.setItem(CONFIG_KEY, JSON.stringify({ apiKey, authDomain, projectId }));
    initApp({ apiKey, authDomain, projectId });
  };
  window.resetConfig = function(){
    if (!confirm('Atelier 연결을 해제할까요? Scroll 설정은 건드리지 않아요.')) return;
    localStorage.removeItem(CONFIG_KEY);
    location.reload();
  };

  function initApp(config){
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    try{
      const app = initializeApp(config);
      db = getFirestore(app);
      setSyncDot('syncing');
      const q = query(collection(db, 'atelierTiles'), orderBy('createdAt', 'asc'));
      onSnapshot(q, snap=>{
        tiles = snap.docs.map(d=>({ id: d.id, ...d.data() }));
        setSyncDot('ok');
        render();
      }, err=>{ setSyncDot('offline'); console.error(err); });
    }catch(e){ alert('Firebase 초기화 실패: ' + e.message); }
  }

  function render(){
    const el = document.getElementById('tiles');
    if (!tiles.length){
      el.innerHTML = '<div class="empty">아직 옷 타일이 없어요.<br>오른쪽 위 ＋ 타일 추가로, 옷 이름·프롬·이미지를 넣어보세요.</div>';
      return;
    }
    el.innerHTML = tiles.map(t=>`
      <div class="tile" onclick="copyTile('${t.id}', event)">
        ${t.img ? `<img class="tile-img" src="${esc(t.img)}" alt="" loading="lazy">` : '<div class="tile-img-empty">이미지 없음</div>'}
        <div class="tile-body">
          <div class="tile-name">${esc(t.name || '이름 없음')}</div>
          <div class="tile-prompt">${esc(t.prompt || '프롬 없음')}</div>
        </div>
        <div class="tile-actions" onclick="event.stopPropagation()">
          <button class="icon-btn" title="수정" onclick="openTileModal('${t.id}')">✏️</button>
          <button class="icon-btn" title="삭제" onclick="deleteTile('${t.id}')">✕</button>
        </div>
      </div>`).join('');
  }
  window.copyTile = async function(id, ev){
    const t = tiles.find(x=>x.id===id);
    if (!t || !t.prompt) return;
    try{ await navigator.clipboard.writeText(t.prompt); }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = t.prompt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1600);
  };
  window.openTileModal = function(id){
    editId = id || null;
    pendingImage = null;
    const file = document.getElementById('tileImage');
    file.value = '';
    const pv = document.getElementById('tileImagePreview');
    pv.classList.remove('show'); pv.src = '';
    document.getElementById('tileModalTitle').textContent = editId ? '타일 수정' : '타일 추가';
    if (editId){
      const t = tiles.find(x=>x.id===editId);
      document.getElementById('tileName').value = t ? (t.name || '') : '';
      document.getElementById('tilePrompt').value = t ? (t.prompt || '') : '';
      if (t && t.img){ pv.src = t.img; pv.classList.add('show'); }
    } else {
      document.getElementById('tileName').value = '';
      document.getElementById('tilePrompt').value = '';
    }
    document.getElementById('tileModal').classList.add('show');
    setTimeout(()=>document.getElementById('tileName').focus(), 100);
  };
  window.closeTileModal = function(){
    document.getElementById('tileModal').classList.remove('show');
    editId = null; pendingImage = null;
  };
  document.getElementById('tileModal').addEventListener('click', e=>{
    if (e.target.id === 'tileModal') closeTileModal();
  });
  document.getElementById('tileImage').addEventListener('change', e=>{
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX = 400;
        let w = img.width, h = img.height;
        if (w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX){ w = Math.round(w * MAX / h); h = MAX; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        pendingImage = cv.toDataURL('image/jpeg', 0.7);
        const pv = document.getElementById('tileImagePreview');
        pv.src = pendingImage; pv.classList.add('show');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  window.saveTile = async function(){
    const name = document.getElementById('tileName').value.trim();
    const prompt = document.getElementById('tilePrompt').value.trim();
    if (!name && !prompt) return;
    setSyncDot('syncing');
    if (editId){
      const data = { name: name || '이름 없음', prompt };
      if (pendingImage) data.img = pendingImage;
      await updateDoc(doc(db, 'atelierTiles', editId), data);
    } else {
      const data = { name: name || '이름 없음', prompt, img: pendingImage || '', createdAt: serverTimestamp() };
      await addDoc(collection(db, 'atelierTiles'), data);
    }
    closeTileModal();
  };
  window.deleteTile = async function(id){
    if (!confirm('이 타일을 삭제할까요? 프롬과 이미지가 함께 지워져요.')) return;
    await deleteDoc(doc(db, 'atelierTiles', id));
  };
  window.exportTiles = function(){
    const blob = new Blob([JSON.stringify({ tiles }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'atelier-don-tiles.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById('importFile').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if (!file) return;
    try{
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.tiles)) throw new Error('bad');
      if (!confirm('가져온 타일을 새로 추가할까요? 기존 타일은 그대로 남아요.')) return;
      for (const t of data.tiles){
        await addDoc(collection(db, 'atelierTiles'), { name: t.name || '이름 없음', prompt: t.prompt || '', img: t.img || '', createdAt: serverTimestamp() });
      }
    }catch(err){ alert('가져오기 실패: Atelier 내보내기 파일이 아니에요.'); }
    e.target.value = '';
  });

  // 시작: Atelier 설정이 있으면 그걸 쓰고, 없으면 Scroll 설정을 복사해서 쓴다.
  // Scroll 설정 자체는 건드리지 않는다 (별도 키에 복사).
  const saved = localStorage.getItem(CONFIG_KEY);
  if (saved){
    try{ initApp(JSON.parse(saved)); }
    catch{ localStorage.removeItem(CONFIG_KEY); }
  } else {
    const scrollSaved = localStorage.getItem(SCROLL_KEY);
    if (scrollSaved){
      try{
        const cfg = JSON.parse(scrollSaved);
        localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
        initApp(cfg);
      }catch{ /* 설정 화면으로 */ }
    }
  }
</script>
</body>
</html>
