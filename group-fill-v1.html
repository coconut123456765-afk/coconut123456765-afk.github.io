<!doctype html><meta charset="utf-8"><title>그룹 채우기 v1</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<body style="font-family:sans-serif;padding:20px">
<h3>청량고 그룹 채우기 v1 (임시)</h3>
<p>이메일 <input id="em" value="dossier@don.local"> 비밀번호 <input id="pw" type="password">
<button id="go">로그인 후 실행</button></p>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
const log = s => { document.getElementById('log').textContent += s + "\n"; };
document.getElementById('go').onclick = async () => {
  try {
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    log('LOGIN OK ' + firebase.auth().currentUser.email);
    const ref = firebase.database().ref('wiki');
    const snap = await ref.get();
    const v = snap.val() || {};
    const store = v.store || {};
    const keys = Object.keys(store);
    log('WORLDS ' + JSON.stringify(keys));
    for (const k of keys) {
      const w = store[k];
      log('WORLD ' + k + ' name=' + (w && w.name) + ' chars=' + ((w && w.chars) ? w.chars.length : 0));
      if (w && w.chars) w.chars.forEach(c => log('  CHAR ' + c.id + ' ' + (c.profile && c.profile.name)));
    }
    // 청량고 세계관 찾기: 이름에 청량고가 있거나 키가 siblings인 세계관
    let wk = null;
    for (const k of keys) { const w = store[k]; if (w && (k === 'siblings' || String(w.name||'').includes('청량고'))) { wk = k; break; } }
    if (!wk) { log('NO CHEONGRYANG WORLD'); return; }
    log('TARGET WORLD ' + wk);
    const w = store[wk];
    const byId = {}; w.chars.forEach(c => byId[c.id] = c);
    const groups = [
      {id:'g-ahn', name:'안씨네', parentId:null},
      {id:'g-cheong', name:'청량고', parentId:null},
      {id:'g-trio', name:'삼총사', parentId:'g-cheong'},
      {id:'g-do', name:'도씨네', parentId:null},
    ];
    w.groups = groups;
    const assign = (cid, gids) => {
      const c = byId[cid];
      if (!c) { log('MISSING CHAR ' + cid); return; }
      c.groupIds = gids;
      log('ASSIGN ' + c.profile.name + ' -> ' + gids.join(','));
    };
    assign('c1792660051543', ['g-ahn']); // 안오룡
    assign('c1792343036533', ['g-ahn']); // 안도하
    assign('c1792394387441', ['g-ahn']); // 안도진
    assign('c1792313574027', ['g-ahn','g-cheong','g-trio']); // 안도이
    assign('c1792350034365', ['g-ahn']); // 안도나
    assign('c1792782821758', ['g-cheong']); // 모니카
    assign('c1792394391937', ['g-cheong','g-trio']); // 안젤리나
    assign('c1792660050682', ['g-do']); // 도말숙
    assign('c1792660214065', ['g-do']); // 도유니
    // 차설화는 그룹 미지정(미분류)으로 둠
    const assigned = w.chars.filter(c => Array.isArray(c.groupIds) && c.groupIds.length).length;
    log('SCANNED ' + w.chars.length + ' ASSIGNED ' + assigned);
    await ref.set(v);
    log('DONE groups=4 assigned=' + assigned + ' scanned=' + w.chars.length);
  } catch(e) { log('ERROR ' + (e && e.message)); }
};
</script></body>
