<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index:Don</title>
<link rel="icon" href="https://res.cloudinary.com/x4eukv2d/image/upload/v1795444314/hub-profile.jpg">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; background: #f6f4f0; color: #1a1a1a; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; }
  .profile { text-align: center; margin-bottom: 32px; }
  .profile img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 14px; border: 3px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.10); }
  .profile h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .profile p { font-size: 14px; color: #6b6b6b; margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { display: block; text-decoration: none; color: inherit; background: var(--bg, #fff); border: 1px solid var(--bd, #e7e4de); border-radius: 16px; padding: 20px 10px 16px; text-align: center; }
  .tile:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .tile img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 10px; }
  .tile .name { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: var(--c, #1a1a1a); }
  .tile .desc { font-size: 12px; color: #6b6b6b; margin: 0; line-height: 1.4; }
  .foot { text-align: center; color: #a8a29a; font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="profile">
    <img src="https://res.cloudinary.com/x4eukv2d/image/upload/v1795444314/hub-profile.jpg" alt="Index:Don">
    <h1>Index:Don</h1>
    <p>Don의 사이트 모음</p>
  </div>

  <div class="tiles">
    <a class="tile" style="--c:#c0392b; --bg:#fdf0ef; --bd:#eec5c1" href="https://coconut123456765-afk.github.io/">
      <img src="https://res.cloudinary.com/x4eukv2d/image/upload/w_192,h_192,c_pad,b_transparent/dossier-logo-red.png" alt="Dossier:Don">
      <p class="name">Dossier:Don</p>
      <p class="desc">캐릭터 위키</p>
    </a>

    <a class="tile" style="--c:#8d6e63; --bg:#f5efe9; --bd:#dccfc2" href="https://coconut123456765-afk.github.io/promptbox/atelier.html">
      <img src="https://res.cloudinary.com/x4eukv2d/image/upload/w_192,h_192,c_pad,b_transparent/atelier-logo-cutout.png" alt="Atelier:Don">
      <p class="name">Atelier:Don</p>
      <p class="desc">프롬프트 보관함</p>
    </a>

    <a class="tile" style="--c:#7b5aa6; --bg:#f3eff8; --bd:#d5c8e8" href="https://coconut123456765-afk.github.io/trunk/">
      <img src="https://res.cloudinary.com/x4eukv2d/image/upload/w_192,h_192,c_pad,b_transparent/trunk-logo-purple.png" alt="Trunk:Don">
      <p class="name">Trunk:Don</p>
      <p class="desc">옷장</p>
    </a>
  </div>

  <p class="foot">새 사이트가 생기면 여기에 추가해요.</p>
</div>
</body>
</html>
