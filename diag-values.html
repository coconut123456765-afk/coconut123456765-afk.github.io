<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body><pre id="log">loading...</pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const FIELDS = ["nickname","ename","birthday","starsign","gender","color","position","affil","birthplace","hobby","specialty","likes","dislikes","quote","overview","appearance","defaultDesc"];
(async ()=>{
  const log = document.getElementById('log');
  try{
    const snap = await db.ref('wiki').get();
    const data = snap.val() || {};
    const store = data.store || {};
    const w = store["w1792508654855"] || {};
    const chars = w.chars || [];
    let out = ["MYBABY chars=" + chars.length];
    chars.forEach(c => {
      const p = c.profile || {};
      out.push("CHAR " + c.id + " | " + (p.name || ""));
      FIELDS.forEach(f => {
        const v = (f in c) ? c[f] : p[f];
        out.push("  " + f + " = " + ((v === undefined || v === null || v === "") ? "(empty)" : String(v).slice(0, 200)));
      });
      out.push("  bodyImg = " + (c.bodyImg ? "YES" : "(empty)"));
      out.push("  pairs = " + ((c.wardrobeImgs||[]).map(g => g.title || "(no title)").join(" / ") || "(none)"));
    });
    out.push("DONE");
    log.textContent = out.join("\n");
  }catch(e){ log.textContent = "ERROR " + e.message; }
})();
</script></body></html>
