<!DOCTYPE html><html><head><meta charset="utf-8"><title>img-check</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body>
<input id="em" placeholder="email"><input id="pw" type="password" placeholder="password">
<button id="go">이미지 확인</button><pre id="log"></pre><script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const logEl=document.getElementById('log');
function log(s){ logEl.textContent += "\n" + s; }
document.getElementById('go').onclick = async ()=>{
  try{
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    const snap = await firebase.database().ref("wiki").once("value");
    const v = snap.val()||{}; const store = v.store||{};
    const mb = store["w1792508654855"];
    log("MyBaby groups="+JSON.stringify(mb.groups||[]));
    (mb.chars||[]).forEach(c=>{
      const rep = c.repImg||""; const ill = String(c.illust||"").split("\n").filter(s=>s.trim());
      log((c.profile&&c.profile.name)+" rep="+(rep?"YES "+rep.slice(0,60):"EMPTY")+" illustLines="+ill.length+" first="+(ill[0]?ill[0].slice(0,60):"")+" thumb="+(c.thumb?"YES":"")+" bodyImg="+(c.bodyImg?"YES":"")+" groupIds="+JSON.stringify(c.groupIds||[]));
    });
    log("DONE");
  }catch(e){ log("ERR "+e.message); }
};
</script></body></html>
