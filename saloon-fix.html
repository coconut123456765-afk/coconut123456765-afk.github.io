<!DOCTYPE html><html><head><meta charset="utf-8"><title>saloon-fix</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head><body>
<input id="em" placeholder="email"><input id="pw" type="password" placeholder="password">
<button id="go">살룬 복구 실행</button><pre id="log"></pre><script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const logEl=document.getElementById('log');
function log(s){ logEl.textContent += "\n" + s; }
document.getElementById('go').onclick = async ()=>{
  try{
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    const ref = firebase.database().ref("wiki");
    const snap = await ref.once("value");
    const v = snap.val()||{};
    const store = v.store||{};
    const w = store["hotel"];
    if (!w) throw new Error("no hotel world");
    const saloonIds = (w.chars||[]).filter(c=>Array.isArray(c.groupIds) && c.groupIds.includes("g-saloon")).map(c=>c.id);
    log("BEFORE hotel chars="+(w.chars||[]).length+" groups="+JSON.stringify(w.groups||[])+" saloonIds="+JSON.stringify(saloonIds));
    // 1단계: 안전한 곳(미분류)으로 옮기기 - 소속과 상급자 연결을 모두 비움, 캐릭터 자체는 건드리지 않음
    (w.chars||[]).forEach(c=>{ if (saloonIds.includes(c.id)){ c.groupIds=[]; c.groupSuperior={}; c.superiorId=null; } });
    log("SAFE step: moved to ungrouped, count="+saloonIds.length);
    // 2단계: 새 살룬 조직 만들기, 애들 다시 넣기
    const newId = "g-saloon-new";
    w.groups = (w.groups||[]).filter(g=>g.id!=="g-saloon" && g.id!==newId);
    w.groups.push({id:newId, name:"살룬 라군", kind:"org", logo:""});
    (w.chars||[]).forEach(c=>{ if (saloonIds.includes(c.id)){ c.groupIds=[newId]; } });
    log("NEW step: groups="+JSON.stringify(w.groups)+" assigned="+JSON.stringify(saloonIds));
    v.store = store;
    v.storeUpdatedAt = Date.now();
    await ref.set(v);
    log("AFTER hotel chars="+(w.chars||[]).length+" groups="+JSON.stringify(w.groups));
    (w.chars||[]).forEach(c=>{ log("  CHAR "+(c.profile&&c.profile.name)+" id="+c.id+" groupIds="+JSON.stringify(c.groupIds||[])); });
    log("DONE");
  }catch(e){ log("ERR "+e.message); }
};
</script></body></html>
