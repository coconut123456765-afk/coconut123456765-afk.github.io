<!doctype html><meta charset="utf-8"><title>그룹 채우기 v2</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<body style="font-family:sans-serif;padding:20px">
<h3>그룹 채우기 v2 (임시)</h3>
<p>이메일 <input id="em" value="dossier@don.local"> 비밀번호 <input id="pw" type="password">
<button id="go">로그인 후 실행</button></p>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
const log = s => { document.getElementById('log').textContent += s + "\n"; };
document.getElementById('go').onclick = async () => {
  try {
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value);
    log('LOGIN OK ' + firebase.auth().currentUser.email);
    const ref = firebase.database().ref('wiki');
    const snap = await ref.get();
    const v = snap.val() || {};
    const store = v.store || {};
    // 청량고 siblings
    const sib = store['siblings'];
    log('SIBLINGS chars=' + (sib && sib.chars ? sib.chars.length : 0));
    sib.groups = [
      {id:'g-ahn', name:'안씨네', parentId:null, kind:'org'},
      {id:'g-cheong', name:'청량고등학교', parentId:null, kind:'org'},
      {id:'g-monica', name:'모니카반', parentId:'g-cheong', kind:'group'},
      {id:'g-trio', name:'삼총사', parentId:'g-monica', kind:'group'},
      {id:'g-do', name:'도씨네', parentId:null, kind:'org'},
    ];
    const byId = {}; sib.chars.forEach(c => byId[c.id] = c);
    const assign = (cid, gids) => { const c = byId[cid]; if (!c) { log('MISSING ' + cid); return; } c.groupIds = gids; log('ASSIGN ' + c.profile.name + ' -> ' + gids.join(',')); };
    assign('c1792660051543', ['g-ahn']);
    assign('c1792343036533', ['g-ahn']);
    assign('c1792394387441', ['g-ahn']);
    assign('c1792313574027', ['g-ahn','g-trio']);
    assign('c1792350034365', ['g-ahn']);
    assign('c1792782821758', ['g-monica']);
    assign('c1792394391937', ['g-trio']);
    assign('c1792660050682', ['g-do']);
    assign('c1792660214065', ['g-do']);
    // 차설화 미분류 유지: groupIds 비움
    if (byId['c1792412450650']) byId['c1792412450650'].groupIds = [];
    log('SIB SCANNED ' + sib.chars.length + ' ASSIGNED ' + sib.chars.filter(c=>c.groupIds && c.groupIds.length).length);
    // 마이베이비: series별 그룹, 조직 없음, 그룹은 기본 펼침
    const mb = store['w1792508654855'];
    log('MYBABY chars=' + (mb && mb.chars ? mb.chars.length : 0));
    const seriesList = [];
    mb.chars.forEach(c => { log('MB ' + c.profile.name + ' series=' + (c.series||'')); if (c.series && !seriesList.includes(c.series)) seriesList.push(c.series); });
    log('MB SERIES ' + JSON.stringify(seriesList));
    mb.groups = seriesList.map((s,i) => ({id:'g-mb-'+i, name:s, parentId:null, kind:'group'}));
    const gBySeries = {}; mb.groups.forEach(g => gBySeries[g.name] = g.id);
    mb.chars.forEach(c => { c.groupIds = c.series && gBySeries[c.series] ? [gBySeries[c.series]] : []; });
    log('MB GROUPS ' + mb.groups.length + ' ASSIGNED ' + mb.chars.filter(c=>c.groupIds && c.groupIds.length).length);
    await ref.set(v);
    log('DONE sib_groups=5 mb_groups=' + mb.groups.length);
  } catch(e) { log('ERROR ' + (e && e.message)); }
};
</script></body>
