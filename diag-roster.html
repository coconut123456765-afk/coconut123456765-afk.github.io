<!doctype html><meta charset="utf-8"><title>diag-roster</title><pre id="o">loading…</pre>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "<redacted>",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
});
firebase.database().ref("wiki").once("value").then(s=>{
  const v = s.val();
  const store = (v && v.store) || v || {};
  const out = [];
  Object.entries(store).forEach(([wk, w])=>{
    if (!w || !Array.isArray(w.chars)) return;
    w.chars.forEach(c=>{
      const p = c.profile || {};
      const illusts = String(c.illust || "").split("\n").map(x=>x.trim()).filter(Boolean);
      out.push({
        world: wk, worldName: w.name || "", id: c.id, name: p.name || "",
        position: c.position || "", color: c.color || "",
        age: p.age || "", height: p.height || "",
        thumb: c.thumb || "", illust0: illusts[0] || "", illustCount: illusts.length,
        wardrobeTitles: (c.wardrobeImgs || []).map(g=>g.title || ""),
        hasAppearance: !!c.appearance, hasPromptChar: !!c.promptChar, hasPromptOutfit: !!c.promptOutfit
      });
    });
  });
  document.getElementById("o").textContent = JSON.stringify(out, null, 1);
}).catch(e=>{ document.getElementById("o").textContent = "ERR " + (e && e.message); });
</script>
