<!DOCTYPE html><html><head><meta charset="utf-8"><title>fill series</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head><body>
<input id="email" value="dossier@don.local">
<input id="pw" type="password">
<button id="loginBtn">로그인</button>
<button id="runBtn" disabled>출연 작품 채우기 실행</button>
<pre id="log"></pre>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv1cDTHmynjnvHI79dddtmyrQgd_sl9xA",
  authDomain: "don-wiki.firebaseapp.com",
  databaseURL: "https://don-wiki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "don-wiki",
  storageBucket: "don-wiki.firebasestorage.app",
  messagingSenderId: "146328839370",
  appId: "1:146328839370:web:2fd7c1b79538fb5ab34033"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.database();
const log = m => { document.getElementById('log').textContent += m + "\n"; };
const FILLS = {"c-anya-1792513789034": {"series": "아이돌마스터 신데렐라 걸즈"}, "c-donki-1792513789034": {"series": "림버스 컴퍼니"}, "c-rider-1792610620827-1": {"series": "Fate/stay night"}, "c-illya-1792610620827-2": {"series": "Fate/kaleid liner 프리즈마☆이리야"}, "c-lilpa-1792610620827-3": {"series": "이세계아이돌"}, "c-anis-1792610620827-4": {"series": "승리의 여신: 니케"}, "c1792684828997": {"series": "우마무스메 프리티 더비"}, "c1792745396777": {"series": "블루아카이브"}, "c1792745397228": {"series": "블루아카이브"}, "c1793110370488": {"series": "원신"}, "c1793125403443": {"series": "원신"}};
document.getElementById('loginBtn').onclick = async () => {
  try {
    await auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pw').value);
    log("로그인됨: " + document.getElementById('email').value);
    document.getElementById('runBtn').disabled = false;
  } catch(e){ log("로그인 실패: " + e.message); }
};
document.getElementById('runBtn').onclick = async () => {
  const snap = await db.ref('wiki').get();
  const data = snap.val() || {};
  const store = data.store || {};
  const w = store["w1792508654855"] || {};
  const chars = w.chars || [];
  let filled = 0, skipped = 0, missing = 0;
  for (const c of chars){
    const f = FILLS[c.id];
    if (!f) continue;
    for (const [k, v] of Object.entries(f)){
      const cur = c[k];
      if (cur !== undefined && cur !== null && String(cur).trim() !== ""){ log("SKIPPED " + c.id + " " + k + " (already filled)"); skipped++; continue; }
      c[k] = v;
      log("FILLED " + c.id + " " + k);
      filled++;
    }
  }
  for (const id of Object.keys(FILLS)){
    if (!chars.find(c => c.id === id)){ log("MISSING CHAR " + id); missing++; }
  }
  await db.ref('wiki').set(data);
  const snap2 = await db.ref('wiki').get();
  const data2 = snap2.val() || {};
  const chars2 = ((data2.store || {})["w1792508654855"] || {}).chars || [];
  let verifyOk = 0, verifyFail = 0;
  for (const c of chars2){
    const f = FILLS[c.id];
    if (!f) continue;
    for (const [k, v] of Object.entries(f)){
      if (c[k] === v) verifyOk++; else { log("VERIFY FAIL " + c.id + " " + k); verifyFail++; }
    }
  }
  log("DONE filled=" + filled + " skipped=" + skipped + " missing=" + missing + " verifyOk=" + verifyOk + " verifyFail=" + verifyFail);
};
</script></body></html>
