const log = (s)=>{ document.getElementById("log").textContent += s + "\n"; };
document.getElementById("login").onclick = async ()=>{
  try{
    await firebase.auth().signInWithEmailAndPassword(document.getElementById("em").value, document.getElementById("pw").value);
    document.getElementById("auth").textContent = "로그인됨: " + firebase.auth().currentUser.email;
    document.getElementById("run").disabled = false;
  }catch(e){ document.getElementById("auth").textContent = "로그인 실패: " + e.message; }
};
document.getElementById("run").onclick = async ()=>{
  document.getElementById("run").disabled = true;
  try{
    const ref = firebase.database().ref("wiki");
    const snap = await ref.once("value");
    const v = snap.val() || {};
    const store = v.store || {};
    let applied = 0, skipped = 0, missing = 0;
    DRAFTS.forEach(d=>{
      let target = null;
      Object.values(store).forEach(w=>{ if (w && Array.isArray(w.chars)) { const c = w.chars.find(x=>x.id===d.id); if (c) target = c; } });
      if (!target){ log("NOT FOUND " + d.name + " " + d.id); missing++; return; }
      if (target.appearance || target.promptChar || target.promptOutfit){ log("SKIP (already filled) " + d.name); skipped++; return; }
      target.appearance = d.appearance;
      target.promptChar = d.promptChar;
      if (d.promptOutfit) target.promptOutfit = d.promptOutfit;
      if (d.refImg && !(target.promptRefImgs && target.promptRefImgs.length)) target.promptRefImgs = [{img: d.refImg, title: "대표 일러스트"}];
      applied++;
      log("OK " + d.name);
    });
    if (store._updatedAt) delete store._updatedAt;
    await ref.set(v);
    const snap2 = await ref.once("value");
    const store2 = (snap2.val() || {}).store || {};
    let verified = 0;
    DRAFTS.forEach(d=>{
      let target = null;
      Object.values(store2).forEach(w=>{ if (w && Array.isArray(w.chars)) { const c = w.chars.find(x=>x.id===d.id); if (c) target = c; } });
      if (target && target.appearance) verified++;
      else log("VERIFY FAIL " + d.name);
    });
    log("DONE applied=" + applied + " skipped=" + skipped + " missing=" + missing + " verified=" + verified + "/" + DRAFTS.length);
  }catch(e){ log("ERROR " + e.message); }
};
